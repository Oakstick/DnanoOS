[package]
name = "void-harvest"
version = "1.0.2"
edition = "2021"
description = "Adventures of the Ancient Blades: a voxel maze crawler"
default-run = "AdventuresOfTheAncientBlades"
build = "build.rs"

[lib]
name = "void_harvest"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "AdventuresOfTheAncientBlades"
path = "src/main.rs"

[features]
default = []
# Steamworks: achievements and overlay-friendly init. Needs the Steam client running.
steam = ["dep:steamworks"]

[dependencies]
wgpu = "25"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
font8x8 = "0.3"
web-time = "1"
gilrs = "0.11"
# Ogg Vorbis decoding for the recorded soundtracks (pure Rust, so it builds for the web too).
lewton = "0.10"
# The engine's loading screen image (read at start-up).
png = "0.17"
# Text on the loading screen: a glyph rasteriser and an openly licensed sans (Ubuntu Light).
ab_glyph = "0.2"
epaint_default_fonts = "0.36"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
cpal = "0.15"
steamworks = { version = "0.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.15", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Storage", "Node", "console", "CssStyleDeclaration"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Grid code walks rows and columns by index on purpose.
needless_range_loop = "allow"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

# For iterating: optimised like release, but without its long link-time optimisation, so a change
# rebuilds in seconds rather than minutes (`cargo build --profile quick`, `cargo test --profile quick`).
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
